server {
    listen 80;
    server_name preview.shengyukj.top;

    # Immutable versioned mobile packages. The App update service references
    # these HTTPS URLs directly, while all other paths remain kkFileView.
    location /app/ {
        alias /opt/shengyu/downloads/yuxin/;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 1y;
    }

    location / {
        proxy_pass http://127.0.0.1:48090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }
}
