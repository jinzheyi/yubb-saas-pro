<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Alphabetical Group Member List</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#C8161D", // Deep red from the header
                        "background-light": "#F2F2F7",
                        "background-dark": "#000000",
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#1C1C1E",
                    },
                    fontFamily: {
                        display: ["-apple-system", "BlinkMacSystemFont", "Helvetica Neue", "PingFang SC", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "10px",
                    },
                },
            },
        };
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .ios-list-item:active {
            background-color: rgba(0, 0, 0, 0.05);
        }
        .dark .ios-list-item:active {
            background-color: rgba(255, 255, 255, 0.05);
        }
        .alphabet-index::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-gray-100 antialiased">
<header class="sticky top-0 z-50 bg-primary text-white shadow-md">
<div class="h-10"></div>
<div class="flex items-center justify-between px-4 pb-3">
<button class="flex items-center space-x-1 active:opacity-60 transition-opacity">
<span class="material-icons text-2xl">chevron_left</span>
<span class="text-base">返回</span>
</button>
<h1 class="text-lg font-semibold absolute left-1/2 -translate-x-1/2">群成员</h1>
<div class="w-10"></div> 
</div>
</header>
<div class="p-3 bg-white dark:bg-surface-dark border-b border-gray-200 dark:border-gray-800">
<div class="relative flex items-center bg-gray-100 dark:bg-gray-800 rounded-lg px-3 py-2">
<span class="material-icons text-gray-400 text-xl mr-2">search</span>
<input class="bg-transparent border-none focus:ring-0 text-sm w-full p-0 placeholder-gray-400" placeholder="搜索" type="text"/>
</div>
</div>
<div class="fixed right-1 top-40 bottom-10 z-40 flex flex-col items-center justify-center space-y-0.5 text-[10px] font-medium text-gray-500 pointer-events-none">
<span>C</span><span>D</span><span>F</span><span>G</span><span>H</span><span>J</span><span>K</span><span>L</span><span>M</span><span>O</span><span>Q</span><span>R</span><span>S</span><span>T</span><span>W</span><span>X</span><span>Y</span><span>Z</span>
</div>
<main class="pb-10">
<div class="bg-gray-100 dark:bg-gray-900 px-4 py-1 text-xs font-semibold text-gray-500 uppercase">C</div>
<div class="bg-white dark:bg-surface-dark">
<div class="ios-list-item flex items-center px-4 py-3 border-b border-gray-100 dark:border-gray-800">
<div class="w-11 h-11 rounded-full bg-blue-400 flex items-center justify-center text-white font-medium text-sm mr-3">
                    鑫思
                </div>
<span class="text-base font-medium">陈鑫思</span>
</div>
<div class="ios-list-item flex items-center px-4 py-3 border-b border-gray-100 dark:border-gray-800">
<div class="w-11 h-11 rounded-full bg-blue-400 flex items-center justify-center text-white font-medium text-sm mr-3">
                    学文
                </div>
<span class="text-base font-medium">程学文</span>
</div>
<div class="ios-list-item flex items-center px-4 py-3 border-b border-gray-100 dark:border-gray-800">
<div class="w-11 h-11 rounded-full bg-pink-400 flex items-center justify-center text-white font-medium text-sm mr-3">
                    碧君
                </div>
<span class="text-base font-medium">陈碧君</span>
</div>
<div class="ios-list-item flex items-center px-4 py-3 border-b border-gray-100 dark:border-gray-800">
<div class="w-11 h-11 rounded-full bg-blue-400 flex items-center justify-center text-white font-medium text-sm mr-3">
                    陈崇
                </div>
<span class="text-base font-medium">陈崇</span>
</div>
<div class="ios-list-item flex items-center px-4 py-3 border-b border-gray-100 dark:border-gray-800">
<div class="w-11 h-11 rounded-full bg-blue-600 flex items-center justify-center text-white font-medium text-sm mr-3">
                    丁丁
                </div>
<span class="text-base font-medium">曾丁丁</span>
</div>
<div class="ios-list-item flex items-center px-4 py-3 border-b border-gray-100 dark:border-gray-800">
<div class="w-11 h-11 rounded-full bg-pink-400 flex items-center justify-center text-white font-medium text-sm mr-3">
                    慧芳
                </div>
<span class="text-base font-medium">陈慧芳</span>
</div>
<div class="ios-list-item flex items-center px-4 py-3 border-b border-gray-100 dark:border-gray-800">
<div class="w-11 h-11 rounded-full bg-blue-400 flex items-center justify-center text-white font-medium text-sm mr-3">
                    程鹏
                </div>
<span class="text-base font-medium">程鹏</span>
</div>
<div class="ios-list-item flex items-center px-4 py-3 border-b border-gray-100 dark:border-gray-800">
<div class="w-11 h-11 rounded-full bg-blue-400 flex items-center justify-center text-white font-medium text-sm mr-3">
                    东杰
                </div>
<span class="text-base font-medium">陈东杰</span>
</div>
<div class="ios-list-item flex items-center px-4 py-3 border-b border-gray-100 dark:border-gray-800">
<div class="w-11 h-11 rounded-full bg-blue-400 flex items-center justify-center text-white font-medium text-sm mr-3">
                    曾庆
                </div>
<span class="text-base font-medium">曾庆</span>
</div>
</div>
<div class="bg-gray-100 dark:bg-gray-900 px-4 py-1 text-xs font-semibold text-gray-500 uppercase">D</div>
<div class="bg-white dark:bg-surface-dark">
<div class="ios-list-item flex items-center px-4 py-3 border-b border-gray-100 dark:border-gray-800">
<div class="w-11 h-11 rounded-full bg-blue-400 flex items-center justify-center text-white font-medium text-sm mr-3">
                    戴云
                </div>
<span class="text-base font-medium">戴云</span>
</div>
<div class="ios-list-item flex items-center px-4 py-3 border-b border-gray-100 dark:border-gray-800">
<div class="w-11 h-11 rounded-full bg-blue-400 flex items-center justify-center text-white font-medium text-sm mr-3">
                    旻晖
                </div>
<span class="text-base font-medium">邓旻晖</span>
</div>
</div>
</main>
<div class="h-8 bg-white dark:bg-surface-dark flex justify-center items-end pb-2 sticky bottom-0 border-t border-gray-100 dark:border-gray-900">
<div class="w-32 h-1 bg-black dark:bg-white rounded-full opacity-20"></div>
</div>

</body></html>
