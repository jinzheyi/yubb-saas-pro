<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Favorites Empty State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#C8161D", // Deep red from the header
                        "background-light": "#F2F2F7",
                        "background-dark": "#000000",
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#1C1C1E",
                    },
                    fontFamily: {
                        display: ["-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "Helvetica Neue", "Arial", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "12px",
                    },
                },
            },
        };
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .category-grid::after {
            content: "";
            flex: auto;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<header class="bg-primary pt-12 pb-3 px-4 flex items-center sticky top-0 z-10">
<button class="flex items-center text-white space-x-1 focus:opacity-70 transition-opacity">
<span class="material-icons text-2xl">chevron_left</span>
<span class="text-lg">返回</span>
</button>
<h1 class="absolute left-1/2 -translate-x-1/2 text-white text-lg font-medium">收藏</h1>
</header>
<div class="px-4 py-2 bg-white dark:bg-surface-dark border-b border-gray-100 dark:border-gray-800">
<div class="relative group">
<span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg">search</span>
<input class="w-full bg-gray-100 dark:bg-gray-800 border-none rounded-lg py-2 pl-10 pr-4 focus:ring-0 text-sm placeholder-gray-500" placeholder="搜索" type="text"/>
</div>
</div>
<main class="flex-1 overflow-y-auto px-4 py-4 space-y-6">
<div class="bg-white dark:bg-surface-dark rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 p-2">
<div class="grid grid-cols-4 gap-y-6 py-4 relative">
<button class="flex flex-col items-center space-y-1 relative group">
<span class="text-blue-500 font-medium text-[15px]">全部</span>
<div class="absolute right-0 top-1/2 -translate-y-1/2 h-6 w-px bg-gray-200 dark:bg-gray-700"></div>
</button>
<button class="flex flex-col items-center space-y-1 relative group">
<span class="text-gray-600 dark:text-gray-400 text-[15px]">图片</span>
<div class="absolute right-0 top-1/2 -translate-y-1/2 h-6 w-px bg-gray-200 dark:bg-gray-700"></div>
</button>
<button class="flex flex-col items-center space-y-1 relative group">
<span class="text-gray-600 dark:text-gray-400 text-[15px]">链接</span>
<div class="absolute right-0 top-1/2 -translate-y-1/2 h-6 w-px bg-gray-200 dark:bg-gray-700"></div>
</button>
<button class="flex flex-col items-center space-y-1">
<span class="text-gray-600 dark:text-gray-400 text-[15px]">文件</span>
</button>
<button class="flex flex-col items-center space-y-1 relative">
<span class="text-gray-600 dark:text-gray-400 text-[15px]">语音</span>
<div class="absolute right-0 top-1/2 -translate-y-1/2 h-6 w-px bg-gray-200 dark:bg-gray-700"></div>
</button>
<button class="flex flex-col items-center space-y-1 relative">
<span class="text-gray-600 dark:text-gray-400 text-[15px]">位置</span>
<div class="absolute right-0 top-1/2 -translate-y-1/2 h-6 w-px bg-gray-200 dark:bg-gray-700"></div>
</button>
<button class="flex flex-col items-center space-y-1 relative">
<span class="text-gray-600 dark:text-gray-400 text-[15px]">公告</span>
<div class="absolute right-0 top-1/2 -translate-y-1/2 h-6 w-px bg-gray-200 dark:bg-gray-700"></div>
</button>
<button class="flex flex-col items-center space-y-1">
<span class="text-gray-600 dark:text-gray-400 text-[15px]">聊天记录</span>
</button>
</div>
</div>
<div class="flex flex-col items-center justify-center pt-20 text-center px-8">
<div class="relative mb-6">
<div class="w-16 h-20 border-2 border-gray-300 dark:border-gray-600 rounded-md relative">
<div class="w-10 h-0.5 bg-gray-300 dark:bg-gray-600 mt-4 mx-auto"></div>
<div class="w-10 h-0.5 bg-gray-300 dark:bg-gray-600 mt-2 mx-auto"></div>
<div class="absolute bottom-2 right-[-8px] bg-background-light dark:bg-background-dark p-1">
<span class="material-icons text-gray-400 text-3xl">search</span>
</div>
</div>
</div>
<h3 class="text-gray-400 dark:text-gray-500 text-lg mb-2">暂无收藏</h3>
<p class="text-gray-300 dark:text-gray-600 text-sm leading-relaxed">
                可以在聊天中长按消息来收藏
            </p>
</div>
</main>
<nav class="bg-white dark:bg-surface-dark border-t border-gray-200 dark:border-gray-800 pb-8 pt-2 flex justify-around items-center">
<button class="flex flex-col items-center space-y-1 text-gray-400 focus:text-primary">
<span class="material-icons">chat_bubble</span>
<span class="text-[10px]">消息</span>
</button>
<button class="flex flex-col items-center space-y-1 text-gray-400 focus:text-primary">
<span class="material-icons">contacts</span>
<span class="text-[10px]">通讯录</span>
</button>
<button class="flex flex-col items-center space-y-1 text-primary">
<span class="material-icons">bookmark</span>
<span class="text-[10px]">收藏</span>
</button>
<button class="flex flex-col items-center space-y-1 text-gray-400 focus:text-primary">
<span class="material-icons">person</span>
<span class="text-[10px]">我的</span>
</button>
</nav>
<div class="fixed bottom-1 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-gray-200 dark:bg-gray-800 rounded-full"></div>

</body></html>
