<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Group QR Code Card</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#C41E3A", // Deep red from the header
                        "background-light": "#F2F2F7",
                        "background-dark": "#000000",
                        "card-light": "#FFFFFF",
                        "card-dark": "#1C1C1E",
                        "ios-blue": "#007AFF",
                    },
                    fontFamily: {
                        display: ["-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "Helvetica Neue", "Arial", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "12px",
                    },
                },
            },
        };
    </script>
<style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .qr-placeholder {
            background-image: radial-gradient(circle, #000 1px, transparent 1px);
            background-size: 8px 8px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex justify-center items-start text-gray-900 dark:text-white">
<div class="w-full max-w-[430px] min-h-screen bg-background-light dark:bg-background-dark flex flex-col relative overflow-hidden">
<div class="bg-primary px-6 pt-12 pb-2 flex justify-between items-center text-white text-sm font-semibold">
<span>2:01</span>
<div class="flex items-center space-x-1.5">
<span class="material-icons text-[16px]">vpn_lock</span>
<span class="material-icons text-[16px]">signal_cellular_alt</span>
<span class="material-icons text-[16px]">wifi</span>
<span class="material-icons text-[20px] rotate-90">battery_full</span>
</div>
</div>
<div class="bg-primary px-2 py-3 flex items-center relative">
<button class="flex items-center text-white px-2 focus:opacity-60 transition-opacity">
<span class="material-icons text-[28px]">chevron_left</span>
<span class="text-lg">返回</span>
</button>
<h1 class="absolute left-1/2 -translate-x-1/2 text-white text-lg font-medium tracking-wide">群二维码</h1>
</div>
<div class="flex-1 flex flex-col items-center justify-center px-8 pb-32">
<div class="w-full bg-card-light dark:bg-card-dark rounded-xl shadow-lg overflow-hidden transition-all duration-300">
<div class="aspect-square p-8 bg-gray-100 dark:bg-zinc-800 flex items-center justify-center">
<div class="w-full h-full relative p-4 bg-white rounded-lg">
<img alt="QR Code for Finance Technology Work Group" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCv-JsGoiwHKortjEGqkZGNi3WXe8yVcM08Rt6uI4rPzSly1j9DCfEAo14GYyeInm2i0fmjetzYkxh8xeup2kQw8yfMhvaNJKflia80Qh5c3MheAPNXwnmVQ9ZeRbrF7V3Sqrm_dXn1-keO0zlvPVGm59Y2A2FkvFhQ5by0ZTUf_v5YSvZ79naKUsIYyz25Hp_lVWqxQajy_HLf5Pp7o5dMsQJBDi_jUyzbPm5qA9k51FjfzuWQSpgLdwWR7NcblpsUW5qMR2LhgP8"/>
</div>
</div>
<div class="p-5 flex items-center space-x-4 border-t border-gray-100 dark:border-zinc-800">
<div class="w-14 h-14 rounded-full overflow-hidden grid grid-cols-2 grid-rows-2 gap-0.5 bg-blue-500">
<div class="flex items-center justify-center bg-blue-400 text-[10px] text-white">丹</div>
<div class="flex items-center justify-center bg-blue-600 text-[10px] text-white">思</div>
<div class="flex items-center justify-center bg-blue-700 text-[10px] text-white">寒</div>
<div class="flex items-center justify-center bg-blue-300 text-[10px] text-white">晨</div>
</div>
<div>
<h2 class="text-base font-bold text-gray-800 dark:text-gray-100">财信科技工作群</h2>
<p class="text-sm text-gray-400 dark:text-gray-500 mt-0.5">扫一扫二维码，加入该群。</p>
</div>
</div>
</div>
</div>
<div class="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-background-light dark:bg-background-dark/80 backdrop-blur-md px-6 pt-4 pb-10 flex space-x-4">
<button class="flex-1 py-3 px-4 bg-white dark:bg-zinc-800 text-gray-800 dark:text-gray-100 border border-gray-200 dark:border-zinc-700 rounded-lg font-medium active:scale-95 transition-transform">
                保存
            </button>
<button class="flex-1 py-3 px-4 bg-ios-blue text-white rounded-lg font-medium active:scale-95 transition-transform shadow-md">
                分享
            </button>
</div>
<div class="fixed bottom-1 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-gray-400/50 dark:bg-gray-600/50 rounded-full"></div>
</div>
<div class="fixed top-4 right-4 z-50">
<button class="p-2 bg-white/20 dark:bg-black/20 backdrop-blur rounded-full text-white" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-icons">contrast</span>
</button>
</div>

</body></html>
