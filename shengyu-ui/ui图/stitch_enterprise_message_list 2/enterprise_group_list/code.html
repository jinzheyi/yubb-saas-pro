<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Enterprise Group List</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#C8161D", // Enterprise Red from the header
                        "background-light": "#F2F2F7",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        display: ["-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "Helvetica Neue", "Arial", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "8px",
                    },
                },
            },
        };
    </script>
<style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-safe-top {
            padding-top: env(safe-area-inset-top);
        }
        .ios-safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 1px;
            overflow: hidden;
            border-radius: 9999px;
            background-color: #E5E7EB;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<header class="bg-primary text-white ios-safe-top sticky top-0 z-50">
<div class="h-12 flex items-center px-4 relative">
<button class="flex items-center text-white focus:outline-none">
<span class="material-icons text-2xl">chevron_left</span>
<span class="text-lg -ml-1">返回</span>
</button>
<h1 class="absolute left-1/2 -translate-x-1/2 text-lg font-medium">我的群组</h1>
</div>
</header>
<div class="px-4 py-2 bg-white dark:bg-zinc-900 border-b border-gray-200 dark:border-zinc-800">
<div class="relative group">
<span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg">search</span>
<input class="w-full bg-gray-100 dark:bg-zinc-800 border-none rounded-lg py-2 pl-10 pr-4 text-sm focus:ring-2 focus:ring-primary focus:bg-white transition-all outline-none text-slate-900 dark:text-slate-200" placeholder="搜索群组" type="text"/>
</div>
</div>
<main class="flex-1 overflow-y-auto bg-white dark:bg-zinc-950">
<div class="flex items-center px-4 py-3 active:bg-gray-50 dark:active:bg-zinc-900 border-b border-gray-100 dark:border-zinc-900 transition-colors">
<div class="avatar-grid w-12 h-12 bg-sky-500 shrink-0">
<div class="flex items-center justify-center text-[10px] text-white border-r border-b border-white/20">丹</div>
<div class="flex items-center justify-center text-[10px] text-white border-b border-white/20">思</div>
<div class="flex items-center justify-center text-[10px] text-white border-r border-white/20">寒</div>
<div class="flex items-center justify-center text-[10px] text-white">晨</div>
</div>
<div class="ml-4 flex-1">
<h3 class="text-[17px] font-normal text-slate-900 dark:text-slate-100">财信科技工作群</h3>
<p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">84 人</p>
</div>
</div>
<div class="flex items-center px-4 py-3 active:bg-gray-50 dark:active:bg-zinc-900 border-b border-gray-100 dark:border-zinc-900 transition-colors">
<div class="avatar-grid w-12 h-12 bg-sky-500 shrink-0">
<div class="flex items-center justify-center text-[10px] text-white border-r border-b border-white/20">生</div>
<div class="flex items-center justify-center text-[10px] text-white border-b border-white/20">坤</div>
<div class="flex items-center justify-center text-[10px] text-white border-r border-white/20">丁</div>
<div class="flex items-center justify-center text-[10px] text-white">弋</div>
</div>
<div class="ml-4 flex-1">
<h3 class="text-[17px] font-normal text-slate-900 dark:text-slate-100">软件研发二部</h3>
<p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">17 人</p>
</div>
</div>
<div class="flex items-center px-4 py-3 active:bg-gray-50 dark:active:bg-zinc-900 border-b border-gray-100 dark:border-zinc-900 transition-colors">
<div class="avatar-grid w-12 h-12 bg-sky-500 shrink-0">
<div class="flex items-center justify-center text-[10px] text-white border-r border-b border-white/20">生</div>
<div class="flex items-center justify-center text-[10px] text-white border-b border-white/20">坤</div>
<div class="flex items-center justify-center text-[10px] text-white border-r border-white/20">丁</div>
<div class="flex items-center justify-center text-[10px] text-white">新</div>
</div>
<div class="ml-4 flex-1">
<h3 class="text-[17px] font-normal text-slate-900 dark:text-slate-100">小贷项目试用支撑群</h3>
<p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">10 人</p>
</div>
</div>
<div class="flex items-center px-4 py-3 active:bg-gray-50 dark:active:bg-zinc-900 border-b border-gray-100 dark:border-zinc-900 transition-colors">
<div class="avatar-grid w-12 h-12 bg-sky-500 shrink-0">
<div class="flex items-center justify-center text-[10px] text-white border-r border-b border-white/20">生</div>
<div class="flex items-center justify-center text-[10px] text-white border-b border-white/20">坤</div>
<div class="flex items-center justify-center text-[10px] text-white border-r border-white/20">凯</div>
<div class="flex items-center justify-center text-[10px] text-white">琴</div>
</div>
<div class="ml-4 flex-1">
<h3 class="text-[17px] font-normal text-slate-900 dark:text-slate-100">软件研发部</h3>
<p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">18 人</p>
</div>
</div>
</main>
<nav class="bg-white dark:bg-zinc-900 border-t border-gray-200 dark:border-zinc-800 ios-safe-bottom">
<div class="flex justify-around items-center h-14">
<button class="flex flex-col items-center justify-center w-full text-gray-400 dark:text-zinc-500">
<span class="material-icons text-2xl">chat_bubble_outline</span>
<span class="text-[10px] mt-1">消息</span>
</button>
<button class="flex flex-col items-center justify-center w-full text-primary">
<span class="material-icons text-2xl">account_tree</span>
<span class="text-[10px] mt-1">组织架构</span>
</button>
<button class="flex flex-col items-center justify-center w-full text-gray-400 dark:text-zinc-500">
<span class="material-icons text-2xl">person_outline</span>
<span class="text-[10px] mt-1">我的</span>
</button>
</div>
</nav>
<div class="bg-white dark:bg-zinc-900 h-6 flex justify-center items-center pb-2">
<div class="w-32 h-1 bg-gray-300 dark:bg-zinc-700 rounded-full"></div>
</div>

</body></html>
