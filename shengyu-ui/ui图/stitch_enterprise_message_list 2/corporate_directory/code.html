<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Corporate Directory</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#C8161D", // Corporate Red from screenshot
              "background-light": "#F7F7F7",
              "background-dark": "#121212",
              "card-light": "#FFFFFF",
              "card-dark": "#1E1E1E",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "8px",
            },
          },
        },
      };
    </script>
<style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .ios-status-bar { height: 44px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 flex justify-center">
<div class="w-full max-w-md min-h-screen flex flex-col relative overflow-hidden bg-background-light dark:bg-background-dark">
<header class="bg-primary pt-12 pb-4 px-4 sticky top-0 z-20">
<div class="flex items-center justify-between mb-4">
<h1 class="text-white text-xl font-semibold">通讯录</h1>
<div class="flex gap-4">
</div>
</div>
<div class="relative">
<span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
<input class="w-full bg-white dark:bg-slate-800 rounded-lg py-2 pl-10 pr-4 border-none focus:ring-0 text-sm text-slate-800 dark:text-slate-200 placeholder-slate-400" placeholder="搜索" type="text"/>
</div>
</header>
<main class="flex-1 overflow-y-auto pb-24 hide-scrollbar">
<section class="bg-card-light dark:bg-card-dark mb-2">
<div class="flex items-center px-4 py-3 border-b border-slate-100 dark:border-slate-800 active:bg-slate-50 dark:active:bg-slate-900 transition-colors">
<div class="w-10 h-10 rounded-full bg-orange-500 flex items-center justify-center text-white mr-3">
<span class="material-icons">smartphone</span>
</div>
<span class="flex-1 font-medium">手机联系人</span>
</div>
<div class="flex items-center px-4 py-3 border-b border-slate-100 dark:border-slate-800 active:bg-slate-50 dark:active:bg-slate-900 transition-colors">
<div class="w-10 h-10 rounded-full bg-orange-400 flex items-center justify-center text-white mr-3">
<span class="material-icons">groups</span>
</div>
<span class="flex-1 font-medium">我的群组</span>
</div>
<div class="flex items-center px-4 py-3 active:bg-slate-50 dark:active:bg-slate-900 transition-colors">
<div class="w-10 h-10 rounded-full bg-yellow-400 flex items-center justify-center text-white mr-3">
<span class="material-icons">star</span>
</div>
<span class="flex-1 font-medium">我的关注</span>
</div>
</section>
<section class="bg-card-light dark:bg-card-dark mb-2">
<div class="flex items-center px-4 py-3 border-b border-slate-100 dark:border-slate-800 active:bg-slate-50 dark:active:bg-slate-900 transition-colors">
<div class="w-10 h-10 rounded-full bg-lime-500 flex items-center justify-center text-white mr-3">
<span class="material-icons">account_tree</span>
</div>
<span class="flex-1 font-medium">组织结构</span>
</div>
<div class="flex items-center px-4 py-3 border-b border-slate-100 dark:border-slate-800 active:bg-slate-50 dark:active:bg-slate-900 transition-colors">
<div class="w-10 h-10 rounded-full bg-cyan-500 flex items-center justify-center text-white mr-3">
<span class="material-icons">layers</span>
</div>
<span class="flex-1 font-medium">我的部门</span>
</div>
<div class="flex items-center px-4 py-3 border-b border-slate-100 dark:border-slate-800 active:bg-slate-50 dark:active:bg-slate-900 transition-colors">
<div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white mr-3">
<span class="material-icons">folder</span>
</div>
<span class="flex-1 font-medium">常用组</span>
</div>
<div class="flex items-center px-4 py-3 active:bg-slate-50 dark:active:bg-slate-900 transition-colors">
<div class="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center text-white mr-3">
<span class="material-icons">person_search</span>
</div>
<span class="flex-1 font-medium">我的下属</span>
</div>
</section>
<section>
<div class="px-4 py-3 text-xs font-medium text-slate-500 uppercase tracking-wider">常用联系人</div>
<div class="bg-card-light dark:bg-card-dark">
<div class="flex items-center px-4 py-3 border-b border-slate-100 dark:border-slate-800 active:bg-slate-50 dark:active:bg-slate-900 transition-colors">
<div class="w-12 h-12 rounded-full bg-sky-500 flex items-center justify-center text-white font-medium mr-3">陶戈</div>
<div class="flex-1">
<h3 class="text-base font-semibold">陶戈</h3>
<p class="text-sm text-slate-500 dark:text-slate-400">高级经理</p>
</div>
</div>
<div class="flex items-center px-4 py-3 border-b border-slate-100 dark:border-slate-800 active:bg-slate-50 dark:active:bg-slate-900 transition-colors">
<div class="w-12 h-12 rounded-full bg-pink-400 flex items-center justify-center text-white font-medium mr-3">子蒙</div>
<div class="flex-1">
<h3 class="text-base font-semibold">陈子蒙</h3>
<p class="text-sm text-slate-500 dark:text-slate-400">部门副总经理 (主持工作)</p>
</div>
</div>
<div class="flex items-center px-4 py-3 border-b border-slate-100 dark:border-slate-800 active:bg-slate-50 dark:active:bg-slate-900 transition-colors">
<div class="w-12 h-12 rounded-full bg-purple-400 flex items-center justify-center text-white font-medium mr-3">丹丹</div>
<div class="flex-1">
<h3 class="text-base font-semibold">刘丹丹</h3>
<p class="text-sm text-slate-500 dark:text-slate-400">行政经理</p>
</div>
</div>
<div class="flex items-center px-4 py-3 border-b border-slate-100 dark:border-slate-800 active:bg-slate-50 dark:active:bg-slate-900 transition-colors">
<div class="w-12 h-12 rounded-full bg-rose-400 flex items-center justify-center text-white font-medium mr-3">胡婷</div>
<div class="flex-1">
<h3 class="text-base font-semibold">胡婷</h3>
<p class="text-sm text-slate-500 dark:text-slate-400">副部长 (主持工作)</p>
</div>
</div>
<div class="flex items-center px-4 py-3 active:bg-slate-50 dark:active:bg-slate-900 transition-colors">
<div class="w-12 h-12 rounded-full bg-emerald-500 flex items-center justify-center text-white font-medium mr-3">述勇</div>
<div class="flex-1">
<h3 class="text-base font-semibold">朱述勇</h3>
<p class="text-sm text-slate-500 dark:text-slate-400">开发工程师</p>
</div>
</div>
</div>
</section>
</main>
<nav class="bg-card-light/95 dark:bg-card-dark/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 fixed bottom-0 left-0 right-0 max-w-md mx-auto h-[84px] pb-5 grid grid-cols-4 items-center">
<button class="flex flex-col items-center justify-center gap-1 text-slate-400 dark:text-slate-500">
<span class="material-icons text-2xl">chat_bubble_outline</span>
<span class="text-[10px] font-medium">消息</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 text-blue-500">
<span class="material-icons text-2xl">person</span>
<span class="text-[10px] font-medium">通讯录</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 text-slate-400 dark:text-slate-500">
<span class="material-icons text-2xl">desktop_windows</span>
<span class="text-[10px] font-medium">工作台</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 text-slate-400 dark:text-slate-500">
<span class="material-icons text-2xl">person_outline</span>
<span class="text-[10px] font-medium">我</span>
</button>
</nav>
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
</div>
<div class="fixed bottom-24 right-4 z-50">
<button class="w-12 h-12 rounded-full bg-white dark:bg-slate-800 shadow-xl flex items-center justify-center border border-slate-200 dark:border-slate-700" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-icons text-slate-800 dark:text-slate-200">dark_mode</span>
</button>
</div>

</body></html>
