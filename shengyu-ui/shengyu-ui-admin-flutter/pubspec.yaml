name: shengyu_ui_admin_im
description: "类似企业微信设计的圣钰SaaS即时通讯系统"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.1
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  web_socket_channel: ^3.0.3
  collection: ^1.19.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.20.2
  web: ^1.1.1
  file_picker: ^10.3.2
  image_picker: ^1.1.2
  camera: ^0.11.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  connectivity_plus: ^6.1.5
  mobile_scanner: ^7.2.0
  record: ^6.2.0
  just_audio: ^0.10.5
  video_player: ^2.9.2
  video_compress: ^3.1.2
  webview_flutter: ^4.10.0
  qr_flutter: ^4.1.0
  extended_text_field: ^14.0.0

  # 本地数据库（企业级IM核心）
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  drift_flutter: ^0.2.4

  # 图片缓存
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

dependency_overrides:
  extended_text_field:
    path: ./_packages/extended_text_field

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  async: ^2.13.0
  stream_channel: ^2.1.4
  drift_dev: ^2.22.0
  build_runner: ^2.4.15

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/emoji/
    - assets/images/emoji/face/
    - assets/images/emoji/gesture/
    - assets/images/emoji/animal/
    - assets/images/emoji/blessing/
    - assets/images/emoji/other/
    - assets/images/emoji_safe/
    - assets/images/emoji_safe/face/
    - assets/images/emoji_safe/gesture/
    - assets/images/emoji_safe/animal/
    - assets/images/emoji_safe/blessing/
    - assets/images/emoji_safe/other/

  fonts:
    - family: AppSans
      fonts:
        - asset: assets/fonts/ArialUnicode.ttf
    - family: ShengyuIconFont
      fonts:
        - asset: assets/fonts/iconfont/iconfont.ttf
