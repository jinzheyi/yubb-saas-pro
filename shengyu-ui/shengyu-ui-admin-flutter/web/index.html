<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="钰信即时通讯">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="钰信">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>钰信</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (function () {
      const isFontManifestRequest = (input) => {
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        return /\/assets\/FontManifest\.json(?:\?.*)?$/.test(url);
      };

      const emptyFontManifestResponse = () =>
        Promise.resolve(
          new Response('[]', {
            status: 200,
            headers: { 'Content-Type': 'application/json' },
          }),
        );

      const originalFetch = window.fetch ? window.fetch.bind(window) : null;
      if (originalFetch) {
        window.fetch = function (input, init) {
          if (isFontManifestRequest(input)) {
            return emptyFontManifestResponse();
          }
          return originalFetch(input, init);
        };
      }

      const OriginalXHR = window.XMLHttpRequest;
      if (OriginalXHR) {
        function InterceptedXHR() {
          const xhr = new OriginalXHR();
          let requestUrl = '';
          const originalOpen = xhr.open;
          const originalSend = xhr.send;
          xhr.open = function (method, url) {
            requestUrl = typeof url === 'string' ? url : '';
            return originalOpen.apply(xhr, arguments);
          };
          xhr.send = function () {
            if (isFontManifestRequest(requestUrl)) {
              Object.defineProperty(xhr, 'readyState', { configurable: true, value: 4 });
              Object.defineProperty(xhr, 'status', { configurable: true, value: 200 });
              Object.defineProperty(xhr, 'responseText', { configurable: true, value: '[]' });
              Object.defineProperty(xhr, 'response', { configurable: true, value: '[]' });
              setTimeout(() => {
                if (typeof xhr.onreadystatechange === 'function') {
                  xhr.onreadystatechange(new Event('readystatechange'));
                }
                if (typeof xhr.onload === 'function') {
                  xhr.onload(new Event('load'));
                }
              }, 0);
              return;
            }
            return originalSend.apply(xhr, arguments);
          };
          return xhr;
        }
        window.XMLHttpRequest = InterceptedXHR;
      }
    })();
  </script>
  <script>
    // Web FCM requires HTTPS in production. Registration is harmless on an
    // unsupported browser; Dart still requests permission only after login.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js').catch(function (error) {
          console.warn('Firebase messaging worker registration failed', error);
        });
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
