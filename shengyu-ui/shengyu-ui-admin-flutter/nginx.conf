server {
  listen 80;
  server_name _;

  gzip on;
  gzip_vary on;
  gzip_static on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/wasm
    text/css
    text/javascript
    text/plain;

  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    expires -1;
  }

  location = /main.dart.js {
    # 文件名固定但会随发布变更：保留本地副本，每次仅用 ETag 轻量校验。
    add_header Cache-Control "public, max-age=0, must-revalidate";
    expires 0;
    try_files $uri =404;
  }

  location = /flutter_bootstrap.js {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    expires 0;
    try_files $uri =404;
  }

  location = /flutter.js {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    expires 0;
    try_files $uri =404;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    expires -1;
    try_files $uri =404;
  }

  location = /version.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    expires -1;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|wasm|json)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
