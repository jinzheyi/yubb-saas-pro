name: shengyu-system

services:
  mysql:
    container_name: shengyu-mysql
    image: mysql:8
    restart: unless-stopped
    tty: true
    # 生产机若已在宿主机运行 MySQL（占用 3306），这里不要再强绑定宿主机端口，避免冲突。
    # 如需暴露端口，可自行加回 ports 映射。
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shengyu-saas}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    volumes:
      - mysql:/var/lib/mysql/
      - ./sql/mysql/1.0/shengyu-saas.sql:/docker-entrypoint-initdb.d/shengyu-saas.sql:ro

  redis:
    container_name: shengyu-redis
    image: redis:6-alpine
    restart: unless-stopped
    # 生产机若已在宿主机运行 Redis（占用 6379），这里不要再强绑定宿主机端口，避免冲突。
    # 如需暴露端口，可自行加回 ports 映射。
    volumes:
      - redis:/data

  kkfileview:
    container_name: shengyu-kkfileview
    build:
      context: .
      dockerfile: deploy/docker/kkfileview/Dockerfile
      args:
        KK_VERSION: 4.4.0
    image: shengyu-kkfileview:4.4.0
    restart: unless-stopped
    ports:
      # TODO(需要你确认/可调整)：宿主机端口（对外访问）
      - "${KKFILEVIEW_HOST_PORT:-48090}:8012"
    environment:
      # TODO(需要你确认/可调整)：Java 内存参数（转换 Office 时 CPU/内存占用较高）
      JAVA_OPTS:
        ${KKFILEVIEW_JAVA_OPTS:-
          -Xms512m
          -Xmx1024m
          -Djava.security.egd=file:/dev/./urandom
        }

  server:
    container_name: shengyu-server
    build:
      context: ./shengyu-server/
    image: shengyu-server
    restart: unless-stopped
    ports:
      - "${SERVER_HOST_PORT:-48080}:48080"
      # Flutter IM 客户端通过 Netty WebSocket 直连；未暴露该端口时，
      # HTTP 登录成功后会一直处于离线/重连状态。
      - "${IM_WEBSOCKET_HOST_PORT:-9000}:9000"
    extra_hosts:
      # 让容器内可用 host.docker.internal 访问宿主机服务（MySQL/Redis 等）
      - "host.docker.internal:host-gateway"
    environment:
      # https://github.com/polovyivan/docker-pass-configs-to-container
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SHENGYU_TOMCAT_MAX_THREADS: ${SHENGYU_TOMCAT_MAX_THREADS:-80}
      SHENGYU_TOMCAT_MIN_SPARE_THREADS: ${SHENGYU_TOMCAT_MIN_SPARE_THREADS:-10}
      SHENGYU_TOMCAT_ACCEPT_COUNT: ${SHENGYU_TOMCAT_ACCEPT_COUNT:-100}
      SHENGYU_TOMCAT_MAX_CONNECTIONS: ${SHENGYU_TOMCAT_MAX_CONNECTIONS:-4096}
      SHENGYU_DRUID_INITIAL_SIZE: ${SHENGYU_DRUID_INITIAL_SIZE:-2}
      SHENGYU_DRUID_MIN_IDLE: ${SHENGYU_DRUID_MIN_IDLE:-5}
      SHENGYU_DRUID_MAX_ACTIVE: ${SHENGYU_DRUID_MAX_ACTIVE:-30}
      SHENGYU_REDIS_POOL_MAX_ACTIVE: ${SHENGYU_REDIS_POOL_MAX_ACTIVE:-40}
      SHENGYU_REDIS_POOL_MAX_IDLE: ${SHENGYU_REDIS_POOL_MAX_IDLE:-10}
      SHENGYU_REDIS_POOL_MIN_IDLE: ${SHENGYU_REDIS_POOL_MIN_IDLE:-2}
      SHENGYU_QUARTZ_THREAD_COUNT: ${SHENGYU_QUARTZ_THREAD_COUNT:-8}
      SHENGYU_NETTY_BOSS_THREADS: ${SHENGYU_NETTY_BOSS_THREADS:-1}
      SHENGYU_NETTY_WORKER_THREADS: ${SHENGYU_NETTY_WORKER_THREADS:-8}
      JAVA_OPTS:
        ${JAVA_OPTS:-
          -Xms512m
          -Xmx512m
          -Djava.security.egd=file:/dev/./urandom
        }
      ARGS:
        --spring.datasource.dynamic.datasource.master.url=${MASTER_DATASOURCE_URL:-jdbc:mysql://shengyu-mysql:3306/shengyu-saas?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true}
        --spring.datasource.dynamic.datasource.master.username=${MASTER_DATASOURCE_USERNAME:-root}
        --spring.datasource.dynamic.datasource.master.password=${MASTER_DATASOURCE_PASSWORD:-123456}
        --spring.datasource.dynamic.datasource.slave.url=${SLAVE_DATASOURCE_URL:-jdbc:mysql://shengyu-mysql:3306/shengyu-saas?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true}
        --spring.datasource.dynamic.datasource.slave.username=${SLAVE_DATASOURCE_USERNAME:-root}
        --spring.datasource.dynamic.datasource.slave.password=${SLAVE_DATASOURCE_PASSWORD:-123456}
        --spring.redis.host=${REDIS_HOST:-shengyu-redis}
        --spring.redis.port=${REDIS_PORT:-6379}
        --spring.redis.database=${REDIS_DATABASE:-0}
        --spring.redis.password=${REDIS_PASSWORD:-}
        --shengyu.captcha.enable=${SHENGYU_CAPTCHA_ENABLE:-true}
        --shengyu.security.mock-enable=${SHENGYU_SECURITY_MOCK_ENABLE:-false}
        --shengyu.access-log.enable=${SHENGYU_ACCESS_LOG_ENABLE:-false}
        --shengyu.app-register.enabled=${SHENGYU_APP_REGISTER_ENABLED:-true}
        --shengyu.app-register.default-package-id=${SHENGYU_APP_REGISTER_DEFAULT_PACKAGE_ID:-1790399764110786000}
        --shengyu.app-register.default-expire-time=${SHENGYU_APP_REGISTER_DEFAULT_EXPIRE_TIME:-2099-12-31T23:59:59}
        --shengyu.app-register.account-count=${SHENGYU_APP_REGISTER_ACCOUNT_COUNT:-1000}
        --shengyu.pay.order-notify-url=${SHENGYU_PAY_ORDER_NOTIFY_URL:-https://apisaas.shengyukj.top/admin-api/pay/notify/order}
        --shengyu.pay.refund-notify-url=${SHENGYU_PAY_REFUND_NOTIFY_URL:-https://apisaas.shengyukj.top/admin-api/pay/notify/refund}
        --shengyu.pay.transfer-notify-url=${SHENGYU_PAY_TRANSFER_NOTIFY_URL:-https://apisaas.shengyukj.top/admin-api/pay/notify/transfer}
        --im.call.livekit.url=${IM_CALL_LIVEKIT_URL:-wss://rtc.shengyukj.top}
        --im.call.livekit.api-key=${IM_CALL_LIVEKIT_API_KEY:-change-me}
        --im.call.livekit.api-secret=${IM_CALL_LIVEKIT_API_SECRET:-change-me}
        --im.call.livekit.token-expire-seconds=${IM_CALL_LIVEKIT_TOKEN_EXPIRE_SECONDS:-600}
        --im.call.livekit.allow-insecure=${IM_CALL_LIVEKIT_ALLOW_INSECURE:-false}
        --im.file-preview.kkfileview.enabled=${IM_KKFILEVIEW_ENABLED:-true}
        --im.file-preview.kkfileview.auto-start=${IM_KKFILEVIEW_AUTO_START:-false}
        --im.file-preview.kkfileview.base-url=${IM_KKFILEVIEW_BASE_URL:-http://127.0.0.1:48090}
        --im.file-preview.kkfileview.source-base-url=${IM_KKFILEVIEW_SOURCE_BASE_URL:-http://host.docker.internal:48080}
        --im.file-preview.kkfileview.stop-on-shutdown=${IM_KKFILEVIEW_STOP_ON_SHUTDOWN:-false}
    depends_on:
      - kkfileview

  admin-vue3:
    container_name: shengyu-admin-vue3
    build:
      context: ./shengyu-ui/shengyu-ui-admin-vue3
      args:
        VITE_BASE_URL: ${ADMIN_VITE_BASE_URL:-http://127.0.0.1:48080}
        VITE_API_URL: ${ADMIN_VITE_API_URL:-/admin-api}
        VITE_PLATFORM_API_URL: ${ADMIN_VITE_PLATFORM_API_URL:-/platform-api}
        VITE_BASE_PATH: ${ADMIN_VITE_BASE_PATH:-/}
        VITE_OUT_DIR: ${ADMIN_VITE_OUT_DIR:-dist-admin}
    image: shengyu-admin-vue3
    restart: unless-stopped
    ports:
      - "${ADMIN_HOST_PORT:-8080}:80"
    depends_on:
      - server

  platform-vue3:
    container_name: shengyu-platform-vue3
    build:
      context: ./shengyu-ui/shengyu-ui-platform-vue3
      args:
        VITE_BASE_URL: ${PLATFORM_VITE_BASE_URL:-http://127.0.0.1:48080}
        VITE_API_URL: ${PLATFORM_VITE_API_URL:-/platform-api}
        VITE_BASE_PATH: ${PLATFORM_VITE_BASE_PATH:-/}
        VITE_OUT_DIR: ${PLATFORM_VITE_OUT_DIR:-dist-platform}
    image: shengyu-platform-vue3
    restart: unless-stopped
    ports:
      - "${PLATFORM_HOST_PORT:-8081}:80"
    depends_on:
      - server

  im-flutter-web:
    container_name: shengyu-im-flutter-web
    build:
      context: ./shengyu-ui/shengyu-ui-admin-flutter
    image: shengyu-im-flutter-web
    restart: unless-stopped
    ports:
      - "${IM_FLUTTER_WEB_HOST_PORT:-8082}:80"
    depends_on:
      - server

volumes:
  mysql:
    driver: local
  redis:
    driver: local
